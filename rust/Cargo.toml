[package]
name = "algolog"
version = "0.1.0"
edition = "2021"
description = "Shared application log client for algosolltd apps"
license = "MIT"
repository = "https://github.com/algosolltd/algolog"
readme = "../README.md"
keywords = ["logging", "algostatus"]
categories = ["development-tools::debugging"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[lib]
name = "algolog"
path = "src/lib.rs"
