[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algolog"
version = "0.1.0"
description = "Shared application log client for algosolltd apps"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["logging", "algostatus"]
dependencies = []

[project.urls]
Repository = "https://github.com/algosolltd/algolog"

[tool.setuptools]
packages = ["algolog"]
